# Keeps every game's build current, and adds the Switch 2 games nxnative gains a profile for, without anyone having to run anything.
#
# Every 5 minutes (GitHub's shortest) a small Linux job asks GitHub whether any game's engine (switch2mac-engine, nxnative, pokopia-native) has a newer
# commit for it, or whether nxnative has a Switch 2 profile switch2mac has no folder for yet (tools/engine/update.py --check --new-games).
# Only when something is due, a Mac job fetches it, re-applies switch2mac's overlay and settings, compiles the game's runtime as a check,
# and commits each game that passes to main. A game that does not fit or does not compile stays where it was (the job's log says why).
# Players' apps pull main when they open, so they get the update without a new app release. Run it by hand from the Actions tab too.
name: Update builds

on:
  schedule:
    - cron: "*/5 * * * *"   # the shortest interval GitHub allows; it may start a run some minutes late
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-builds
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/engine/update.py --new-games --check

  update:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: The newest Xcode on the runner
        run: |
          x=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$x" ]; then sudo xcode-select -s "$x"; fi
          xcodebuild -version
      - name: Update the builds and add new games
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 -m venv .venv && .venv/bin/pip install -q -r requirements.txt
          python3 tools/engine/update.py --new-games --apply --compile --ci
      - name: Publish
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git pull -q --rebase origin main
            git push origin HEAD:main
          else
            echo "nothing passed its checks: main stays as it is"
          fi
